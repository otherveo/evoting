# Include in http context. Include the reviewed output of cloudflare-real-ip.sh
# once in the Cloudflare-facing server.
map $uri $evoting_log_path {
    default $uri;
    ~^/v/ /v/[redacted];
}
log_format evoting escape=json '{"ip":"$remote_addr","method":"$request_method","path":"$evoting_log_path","status":$status,"upstream_status":"$upstream_status","request_id":"$upstream_http_x_request_id"}';

# For the Cloudflare Tunnel vhost only. realip_remote_addr retains the socket peer.
map "$realip_remote_addr:$http_x_forwarded_proto" $evoting_fastcgi_https {
    default $https;
    "127.0.0.1:https" on;
}

