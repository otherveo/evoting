# Include in http context. Include the reviewed output of cloudflare-real-ip.sh
# once in the Cloudflare-facing server.
map $uri $evoting_log_path {
    default $uri;
    ~^/v/ /v/[redacted];
}
log_format evoting escape=json '{"ip":"$remote_addr","method":"$request_method","path":"$evoting_log_path","status":$status,"request_id":"$upstream_http_x_request_id"}';

